<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Thank You</title>

    body {
      background-color: #022a30;
      color: #e0f780;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
      text-align: center;
    }
    .popup {
      background-color: #033f47;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 20px #e0f780;

    .popup a {
      display: inline-block;

      color: #deff58;
      text-decoration: none;
      font-weight: bold;
    }
  </style>

<body>
  <div class="popup">
    <h2>✅ Message Sent Successfully!</h2>
    <p>Thanks for contacting me. I’ll get back to you soon.</p>

</html>
